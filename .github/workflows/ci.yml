name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Fixed-seed smoke test
        run: npm run test -- --run --reporter=verbose

      - name: Build
        run: npm run build

      - name: Preview health check
        run: |
          npm run preview -- --port 4173 &
          sleep 3
          curl -fsS http://localhost:4173/ > /dev/null
          echo "preview serving OK"

  # 阶段 1+ 部署健康检查占位。部署链接由集成 Issue 统一维护。
  deploy-health:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Verify deploy placeholder
        run: echo "Deploy lane owned by integration Issue (delivery_role=integration)."
